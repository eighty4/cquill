  test-macos-compat:
    name: "test macos"
    runs-on: macos-latest
    env:
      JAVA_VERSION: 17
      PYTHON_VERSION: 3.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'oracle-openjdk'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: brew install cassandra@5.0
      - run: /opt/homebrew/opt/cassandra/bin/cassandra -Djava.security.manager=allow
      - name: wait for :9042
        run: |
          sleep 30
          for i in {1..30}; do
            if nc -z localhost 9042; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: /opt/homebrew/opt/cassandra/bin/cqlsh -e 'describe cluster'
      - run: rustup install stable --profile minimal
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p cquill --lib
