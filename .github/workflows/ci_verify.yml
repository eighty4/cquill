  test-windows-compat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: gh release download --repo microsoft/WSL --pattern "wsl.*.x64.msi" --clobber --output - > wsl.msi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: Start-Process msiexec.exe -Wait -ArgumentList "/i wsl.msi /quiet /qn /norestart"
      - run: wsl --install -d Debian --no-launch
      - run: wsl -d Debian bash -c "apt-get update && apt-get install -y wget"
      - run: wsl -d Debian bash -c "apt-get update && apt-get install -y python3"
      - run: wsl -d Debian bash -c "mkdir -p /etc/apt/keyrings"
      - run: wsl -d Debian bash -c "wget -O /etc/apt/keyrings/adoptium.asc https://packages.adoptium.net/artifactory/api/gpg/key/public"
      - run: wsl -d Debian bash -c 'echo "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb trixie main" | sudo tee /etc/apt/sources.list.d/adoptium.list'
      - run: wsl -d Debian bash -c "apt-get update && apt-get install -y temurin-17-jdk"
      - run: wsl -d Debian bash -c "wget -O /etc/apt/keyrings/apache-cassandra.asc https://downloads.apache.org/cassandra/KEYS"
      - run: wsl -d Debian bash -c 'echo "deb [signed-by=/etc/apt/keyrings/apache-cassandra.asc] https://debian.cassandra.apache.org 50x main" | sudo tee -a /etc/apt/sources.list.d/cassandra.list'
      - run: wsl -d Debian bash -c 'echo "exit 101" > /usr/sbin/policy-rc.d'
      - run: wsl -d Debian bash -c "chmod +x /usr/sbin/policy-rc.d"
      - run: wsl -d Debian bash -c "apt-get update && apt-get install -y cassandra"
      - run: wsl -d Debian bash -c 'rm /usr/sbin/policy-rc.d'
      - run: 'wsl -d Debian bash -c "sed -i ''s/^rpc_address:.*/rpc_address: 0.0.0.0/'' /etc/cassandra/cassandra.yaml"'
      - run: 'wsl -d Debian bash -c "sed -i ''s/^listen_address:.*/listen_address: 127.0.0.1/'' /etc/cassandra/cassandra.yaml"'
      - run: |
          wsl -d Debian bash -c 'echo "broadcast_rpc_address: $(hostname -I)" >> /etc/cassandra/cassandra.yaml'
      - run: wsl -d Debian bash -c "cat /etc/cassandra/cassandra.yaml"
      - run: wsl -d Debian bash -c "systemctl start cassandra"
      - run: rustup install stable --profile minimal
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p cquill --lib --no-run
      - run: wsl -d Debian bash -c 'sleep 20; until cqlsh -e "DESCRIBE CLUSTER;"; do sleep 1; done'
        timeout-minutes: 2
      - run: |
          $env:CQUILL_TEST_DB_HOST = (wsl hostname -I).Trim()
          cargo test -p cquill --lib
