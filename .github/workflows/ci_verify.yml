name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:

  verified:
    runs-on: ubuntu-latest
    needs:
      - build-os-compat
      - examples-and-docs
      - fmt-and-lint-and-test-cquill-ast
      - test-cql-compat
      # - test-integration-compat
      - test-macos-compat
    steps:
      - run: echo "¡Verdes como tomatillos!"

  build-os-compat:
    name: "build ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt_package_linker: gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt_package_linker: gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ matrix.apt_package_linker }}
        run: |
          sudo apt update && sudo apt install ${{ matrix.apt_package_linker }}
          mkdir -p $HOME/.cargo
          mv ./.github/workflows/linkers.toml $HOME/.cargo/config.toml
      - run: rustup install stable --profile minimal
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: rustup target add ${{ matrix.target}}
      - run: cargo build -p cquill --release --all-features --target ${{ matrix.target }}

  examples-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up scylla_2026 -d --quiet-pull --wait
      - run: rustup install stable --profile minimal
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --doc
      - run: cargo run -p cquill --example default_connection
      - run: cargo run -p cquill --example session_connection
      - run: docker compose down scylla_2026
      - run: docker compose up password_auth -d --quiet-pull --wait
      - run: cargo run -p cquill --example cqlshrc_password_auth
      - run: cargo run -p cquill --example password_auth

  fmt-and-lint-and-test-cquill-ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup install stable --profile minimal
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -v
      - run: git diff --exit-code
      - name: lint
        run: cargo clippy --workspace -- -D warnings
      - name: lint tests
        run: cargo clippy --workspace --tests -- -D warnings
      - run: cargo test -p cquill_ast

  test-cql-compat:
    name: "test cql ${{ matrix.image_name }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: cassandra:5
          - image_name: cassandra:4
          - image_name: cassandra:3
          - image_name: scylladb/scylla:2026.1
          - image_name: scylladb/scylla:2025.1
          - image_name: scylladb/scylla:6.2
          - image_name: scylladb/scylla:5.4
    services:
      scylladb:
        image: ${{ matrix.image_name }}
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'describe cluster'"
          --health-start-period 30s
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup install stable --profile minimal
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p cquill --lib

