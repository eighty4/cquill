name: GH Release
run-name: GH Release ${{ inputs.tag }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        required: true
      latest:
        type: boolean
        required: true
      prerelease:
        type: boolean
        required: true
      tag:
        type: string
        required: true
      version:
        type: string
        required: true

env:
  NODE_V: 26

jobs:
  create-gh-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ !inputs.dry-run && inputs.tag || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_V }}
      - run: npm i -g @eighty4/changelog
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bins
      - name: gh_release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          LATEST: ${{ inputs.latest }}
        run: ./.github/workflows/gh_release.sh ./bins

  cleanup-gh-release:
    needs: [ create-gh-release ]
    if: ${{ always() && inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh release delete --repo ${{ github.repository }} "${{ inputs.tag }}" --cleanup-tag --yes
