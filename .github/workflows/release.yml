name: Release
run-name: ${{ contains(fromJSON('["alpha", "beta", "rc"]'), inputs.semver-bump) && 'Prer' || 'R'}}eleasing ${{ inputs.semver-bump }} on ${{ inputs.commit-sha || 'HEAD' }}${{ inputs.dry-run && ' (dry run)' || '' }}${{ inputs.latest && ' (latest)' || '' }}

on:
  workflow_dispatch:
    inputs:
      commit-sha:
        description: Commit SHA to tag and release
        required: false
        type: string
      semver-bump:
        description: Semver bump release type
        required: true
        type: choice
        default: alpha
        options:
          - major
          - minor
          - patch
          - release
          - rc
          - beta
          - alpha
      dry-run:
        description: Perform release dry run
        required: true
        type: boolean
        default: true
      latest:
        description: Promote to latest release
        required: true
        type: boolean
        default: false

concurrency: release

env:
  NODE_V: 26
  RUST_V: 1.98.1

jobs:

  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_V }}
      - run: npm i -g @eighty4/changelog
      - name: check changelog
        run: changelog check --changelog-file cquill/CHANGELOG.md
      - name: check latest
        if: inputs.latest && contains(fromJSON('["alpha", "beta", "rc"]'), inputs.semver-bump)
        run: exit 1
      - name: check commit sha
        if: inputs.commit-sha == '' && !inputs.dry-run
        run: exit 1

  verified:
    needs: [ check-build ]
    uses: ./.github/workflows/ci_verify.yml

  publish-cargo-crate:
    needs: [ verified, check-build ]
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
      - run: rustup install $RUST_V --profile minimal
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: install cargo-release
        run: cargo binstall --no-confirm cargo-release
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: git user config
        run: |
          git config --global user.name "Adam McKee"
          git config --global user.email "adam.be.g84d@gmail.com"
      - name: cargo release
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          SEMVER_BUMP: ${{ github.event.inputs.semver-bump }}
          TO_RUN_OR_NOT_TO_RUN: ${{ !inputs.dry-run && ' -x' || '' }}
        run: cargo release -p cquill --no-confirm$TO_RUN_OR_NOT_TO_RUN $SEMVER_BUMP
      - id: semver-bump-dry-run
        if: ${{ inputs.dry-run }}
        run: cargo release version -p cquill --no-confirm --execute ${{ inputs.semver-bump }}
      - id: semver
        run: |
          VERSION=$(awk -F ' = ' '$1 ~ /version/ { gsub(/[\"]/, "", $2); printf("%s",$2) }' cquill/Cargo.toml)
          test -n "$VERSION"
          echo "tag_name=cquill-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    outputs:
      tag_name: ${{ steps.semver.outputs.tag_name }}
      version: ${{ steps.semver.outputs.version }}

  create-gh-release:
    needs: publish-cargo-crate
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/gh_release.yml
    with:
      dry-run: ${{ inputs.dry-run }}
      latest: ${{ inputs.latest }}
      prerelease: ${{ contains(fromJSON('["alpha", "beta", "rc"]'), inputs.semver-bump) }}
      tag: ${{ needs.publish-cargo-crate.outputs.tag_name }}
      version: ${{ needs.publish-cargo-crate.outputs.version }}

  docker-publish:
    needs: publish-cargo-crate
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    uses: ./.github/workflows/docker_push.yml
    with:
      dry-run: ${{ inputs.dry-run }}
      version: ${{ needs.publish-cargo-crate.outputs.version }}
