name: Docker push
run-name: Docker push ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dry-run:
        type: boolean
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: true

env:
  RUST_V: 1.98.1

jobs:
  build-and-push:
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 84tech
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build
        env:
          CQUILL_V: ${{ inputs.version }}
          RUST_V: ${{ env.RUST_V }}
        run: docker build -t 84tech/cquill --build-arg "CQUILL_VERSION=$CQUILL_V" --build-arg "RUST_VERSION=$RUST_V" -f cquill.install.Dockerfile .
      - name: tag
        env:
          CQUILL_V: ${{ inputs.version }}
        run: docker tag 84tech/cquill "84tech/cquill:$CQUILL_V"
      - name: push
        run: docker push -a 84tech/cquill

  check-docker-login:
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 84tech
          password: ${{ secrets.DOCKERHUB_TOKEN }}
